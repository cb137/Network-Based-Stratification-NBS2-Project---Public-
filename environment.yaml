name: nbss
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1        # remove this line if using Mac (see note below)
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - tqdm
  - pip
  - pip:
      - networkx
      - matplotlib
